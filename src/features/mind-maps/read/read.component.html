<p-panel header="MindMaps - Read - {{mindMap.mindMapId > 0 ? mindMap.mindMapId : 'Not Found'}}">
  <form form="form">
    <p-card>
      <div class="card">
        @if (categories.length > 0) {
          <div class="columns-1 sm:columns-2 py-2">
            <div>
              <label for="categoryId">&nbsp;Categoría</label>
              <p-select inputId="categoryId"
                [formControl]="controls.categoryId"
                [options]="categories"
                optionLabel="label" optionValue="value" optionDisabled="inactive"
                [readonly]="true"
                class="w-full">
              </p-select>
            </div>
            <div>
              <label for="title">&nbsp;Tema</label>
              <input type="text" id="title" inputId="title" pInputText
                [formControl]="controls.title"
                title="Title" placeholder="Enter a title"
                [readonly]="true"
                class="w-full" />
            </div>
          </div>
          <div class="columns-1 sm:columns-2 py-2">
            <div>
              <label for="subtitle">&nbsp;Título</label>
              <input type="text" id="subtitle" inputId="subtitle" pInputText
                [formControl]="controls.subtitle"
                title="Subtitle" placeholder="Enter a subtitle"
                [readonly]="true"
                class="w-full" />
            </div>
            <div>
              <br />
            </div>
          </div>
          <div class="columns-1">
            @if (mindMap.svg) {
              <p-card>
                <img
                  alt="{{mindMap.title}} - {{mindMap.subtitle}}"
                  [src]="getSvgUrl(mindMap)"
                  class="w-full"/>
              </p-card>
            }
          </div>
        }
        <p-confirmDialog [style]="{width: '50vw'}" [baseZIndex]="10000" rejectButtonStyleClass="p-button-text"></p-confirmDialog>
        <p-toast></p-toast>
      </div>
    </p-card>
  </form>
</p-panel>

<app-message-modal
  [visible]="appService.process.isInProcess()"
  [message]="appService.process.message()">
</app-message-modal>
